apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: daiki-ai-passport
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: ghcr.io/poom-ytthpch/daiki-ai-passport-backend:sha-13b5c54
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: ADDR, value: ":8080"}
            - {name: OIDC_ISSUER, value: "https://api.matchchemical.co/realms/daiki"}
            - {name: OIDC_JWKS_URL, value: "http://keycloak:8080/realms/daiki/protocol/openid-connect/certs"}
            - {name: OIDC_CLIENT_ID, value: daiki-web}
            - {name: KEYCLOAK_BASE_URL, value: "http://keycloak:8080"}
            - {name: KEYCLOAK_REALM, value: daiki}
            - {name: KEYCLOAK_ADMIN_USER, value: bootstrap-admin}
            - {name: KEYCLOAK_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: keycloak-bootstrap-password}}}
            - {name: ADMIN_EMAIL, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: admin-email}}}
            - {name: LITELLM_BASE_URL, value: "http://litellm:4000"}
            - {name: LITELLM_MASTER_KEY, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: litellm-master-key}}}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: backend-database-url}}}
            - {name: REDIS_ADDR, value: "daiki-redis:6379"}
            - {name: MODEL_FAST, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: model-fast}}}
            - {name: MODEL_BALANCED, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: model-balanced}}}
            - {name: MODEL_DEEP, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: model-deep}}}
            - {name: MODEL_VISION, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: model-vision}}}
            - {name: INFERENCE_GLOBAL_CONCURRENCY, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-global-concurrency}}}
            - {name: INFERENCE_FAST_CONCURRENCY, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-fast-concurrency}}}
            - {name: INFERENCE_DEEP_CONCURRENCY, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-deep-concurrency}}}
            - {name: INFERENCE_VISION_CONCURRENCY, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-vision-concurrency}}}
            - {name: INFERENCE_IMAGE_CONCURRENCY, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-image-concurrency}}}
            - {name: INFERENCE_EMBEDDING_CONCURRENCY, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-embedding-concurrency}}}
            - {name: INFERENCE_BATCH_CONCURRENCY, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-batch-concurrency}}}
            - {name: INFERENCE_LEASE_SECONDS, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-lease-seconds}}}
            - {name: INFERENCE_MAX_WAIT_SECONDS, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: inference-max-wait-seconds}}}
            - {name: PENDING_CHAT_TOKEN_LIMIT, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: pending-chat-token-limit}}}
            - {name: PENDING_CHAT_REQUESTS_PER_HOUR, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: pending-chat-requests-per-hour}}}
            - {name: PENDING_CHAT_MIN_INTERVAL_SECONDS, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: pending-chat-min-interval-seconds}}}
            - {name: PENDING_CHAT_MAX_COMPLETION_TOKENS, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: pending-chat-max-completion-tokens}}}
            - {name: LOCAL_LLM_BASE_URL, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: local-llm-base-url}}}
            - {name: ALLOWED_ORIGINS, value: "https://daiki-aipass.matchchemical.co,https://ai.infra.local"}
          readinessProbe:
            httpGet: {path: /v1/health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /v1/health/live, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: daiki-ai-passport
spec:
  selector: {app: backend}
  ports:
    - {name: http, port: 8080, targetPort: http}

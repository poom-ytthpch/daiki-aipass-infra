apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: daiki-ai-passport
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/poom-ytthpch/daiki-ai-passport-frontend:sha-3ae1a3c
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: HOSTNAME, value: "0.0.0.0"}
            - {name: DAIKI_BACKEND_URL, value: "http://backend:8080"}
            - {name: OIDC_ISSUER, value: "https://api.matchchemical.co/realms/daiki"}
            - {name: OIDC_INTERNAL_ISSUER, value: "http://keycloak:8080/realms/daiki"}
            - {name: OIDC_CLIENT_ID, value: daiki-web}
            - {name: OIDC_REDIRECT_URI, value: "https://daiki-aipass.matchchemical.co/api/auth/callback"}
            - {name: PUBLIC_BASE_URL, value: "https://daiki-aipass.matchchemical.co"}
            - {name: GOOGLE_CLIENT_ID, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: google-client-id, optional: true}}}
            - {name: ADMIN_EMAIL, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: admin-email}}}
            - {name: COOKIE_SECURE, value: "true"}
            - {name: SESSION_SECRET, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: session-secret}}}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: daiki-ai-passport
spec:
  selector: {app: frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daiki-ai-passport
  namespace: daiki-ai-passport
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["ai.infra.local"]
      secretName: daiki-ai-passport-infra-local-tls
  rules:
    - host: ai.infra.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 80}}}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daiki-ai-passport-public
  namespace: daiki-ai-passport
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["daiki-aipass.matchchemical.co"]
      secretName: daiki-aipass-matchchemical-co-tls
  rules:
    - host: daiki-aipass.matchchemical.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 80}}}

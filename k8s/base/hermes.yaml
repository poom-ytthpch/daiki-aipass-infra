apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: daiki-ai-passport
data:
  config.yaml: |
    _config_version: 41
    model:
      default: groq-qwen-qwen3.8-27b
      provider: custom
      base_url: http://litellm:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
    providers:
      custom:
        models:
          groq-qwen-qwen3.8-27b:
            supports_vision: true
          groq-openai-gpt-oss-20b:
            supports_vision: false
          groq-openai-gpt-oss-120b:
            supports_vision: false
    auxiliary:
      title_generation:
        enabled: false
        provider: main
      compression:
        provider: main
        max_concurrency: 2
    gateway:
      multiplex_profiles: true
      multiplex_profile_allowlist:
        - user
        - skills
        - agent
        - research
        - guest
        - guest-media
      api_server:
        max_concurrent_runs: 4
      platforms:
        api_server:
          extra:
            direct_model_requests: true
    # Logged-in Daiki users get Hermes' safe agent surface and skill learning.
    # Host shell/filesystem/code execution stay disabled until a real isolated
    # execution backend is available.
    platform_toolsets:
      api_server:
        - web
        - browser
        - vision
        - image_gen
        - skills
        - todo
        - delegation
        - session_search
        - clarify
    skills:
      write_approval: false
    terminal:
      backend: docker
      docker_network: false
      docker_mount_cwd_to_workspace: false
    tool_loop_guardrails:
      non_interactive_hard_stop_enabled: true
    agent:
      api_max_retries: 1
      image_input_mode: native
      disabled_toolsets:
        - terminal
        - file
        - code_execution
        - cronjob
        - memory
        - messaging
        - homeassistant
        - spotify
        - discord
        - discord_admin
  user-config.yaml: |
    _config_version: 41
    model:
      default: groq-qwen-qwen3.8-27b
      provider: custom
      base_url: http://litellm:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
    providers:
      custom:
        models:
          groq-qwen-qwen3.8-27b:
            supports_vision: true
          groq-openai-gpt-oss-20b:
            supports_vision: false
          groq-openai-gpt-oss-120b:
            supports_vision: false
    auxiliary:
      title_generation:
        enabled: false
        provider: main
      compression:
        provider: main
        max_concurrency: 2
    gateway:
      platforms:
        api_server:
          enabled: false
    # Normal chat stays intentionally lean. Daiki routes skill-learning and
    # delegation intents to dedicated profiles so every turn does not pay the
    # token cost of heavy tool schemas.
    platform_toolsets:
      api_server:
        - clarify
    skills:
      write_approval: false
    terminal:
      backend: docker
      docker_network: false
      docker_mount_cwd_to_workspace: false
    tool_loop_guardrails:
      non_interactive_hard_stop_enabled: true
    agent:
      api_max_retries: 1
      image_input_mode: native
      disabled_toolsets:
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - image_gen
        - video
        - video_gen
        - x_search
        - memory
        - context_engine
        - cronjob
        - computer_use
        - messaging
        - homeassistant
        - spotify
        - discord
        - discord_admin
  skills-config.yaml: |
    _config_version: 41
    model:
      default: groq-openai-gpt-oss-20b
      provider: custom
      base_url: http://litellm:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
    providers:
      custom:
        models:
          groq-qwen-qwen3.8-27b:
            supports_vision: true
          groq-openai-gpt-oss-20b:
            supports_vision: false
          groq-openai-gpt-oss-120b:
            supports_vision: false
    auxiliary:
      title_generation:
        enabled: false
        provider: main
      compression:
        provider: main
        max_concurrency: 2
    gateway:
      platforms:
        api_server:
          enabled: false
    # Skill discovery/learning is loaded only for tasks routed here. Agent-created
    # skills are backed up and curated, but never auto-deleted or auto-merged.
    platform_toolsets:
      api_server:
        - skills
        - clarify
    skills:
      write_approval: false
    curator:
      enabled: true
      interval_hours: 24
      min_idle_hours: 2
      stale_after_days: 30
      archive_after_days: 90
      consolidate: false
      prune_builtins: false
      archive_ttl_days: 0
      backup:
        enabled: true
        keep: 5
    terminal:
      backend: docker
      docker_network: false
      docker_mount_cwd_to_workspace: false
    agent:
      api_max_retries: 1
      disabled_toolsets:
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - image_gen
        - video
        - video_gen
        - x_search
        - todo
        - memory
        - context_engine
        - session_search
        - delegation
        - cronjob
        - computer_use
        - messaging
        - homeassistant
        - spotify
        - discord
        - discord_admin
  agent-config.yaml: |
    _config_version: 41
    model:
      default: groq-openai-gpt-oss-20b
      provider: custom
      base_url: http://litellm:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
    auxiliary:
      title_generation:
        enabled: false
        provider: main
      compression:
        provider: main
        max_concurrency: 2
    gateway:
      platforms:
        api_server:
          enabled: false
    # Expensive delegation schema is available only when Daiki detects an
    # explicit multi-agent/delegation request.
    platform_toolsets:
      api_server:
        - delegation
        - clarify
    terminal:
      backend: docker
      docker_network: false
      docker_mount_cwd_to_workspace: false
    tool_loop_guardrails:
      non_interactive_hard_stop_enabled: true
    agent:
      api_max_retries: 1
      disabled_toolsets:
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - image_gen
        - video
        - video_gen
        - x_search
        - skills
        - todo
        - memory
        - context_engine
        - session_search
        - cronjob
        - computer_use
        - messaging
        - homeassistant
        - spotify
        - discord
        - discord_admin
  research-config.yaml: |
    _config_version: 41
    model:
      default: groq-openai-gpt-oss-20b
      provider: custom
      base_url: http://litellm:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
    auxiliary:
      title_generation:
        enabled: false
        provider: main
      compression:
        provider: main
    gateway:
      platforms:
        api_server:
          enabled: false
    platform_toolsets:
      api_server: []
    terminal:
      backend: docker
      docker_network: false
      docker_mount_cwd_to_workspace: false
    agent:
      api_max_retries: 1
      disabled_toolsets:
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - image_gen
        - video
        - video_gen
        - x_search
        - skills
        - todo
        - memory
        - context_engine
        - session_search
        - delegation
        - cronjob
        - computer_use
        - messaging
        - homeassistant
        - spotify
        - discord
        - discord_admin
  guest-config.yaml: |
    _config_version: 41
    model:
      default: groq-openai-gpt-oss-20b
      provider: custom
      base_url: http://litellm:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
    providers:
      custom:
        models:
          groq-qwen-qwen3.8-27b:
            supports_vision: true
          groq-openai-gpt-oss-20b:
            supports_vision: false
          groq-openai-gpt-oss-120b:
            supports_vision: false
    auxiliary:
      title_generation:
        enabled: false
        provider: main
      compression:
        provider: main
    gateway:
      platforms:
        api_server:
          enabled: false
    platform_toolsets:
      api_server: []
    terminal:
      backend: docker
      docker_network: false
      docker_mount_cwd_to_workspace: false
    agent:
      api_max_retries: 1
      image_input_mode: native
      disabled_toolsets:
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - image_gen
        - video
        - video_gen
        - x_search
        - skills
        - todo
        - memory
        - context_engine
        - session_search
        - delegation
        - cronjob
        - computer_use
        - messaging
        - homeassistant
        - spotify
        - discord
        - discord_admin
  guest-media-config.yaml: |
    _config_version: 41
    model:
      default: groq-openai-gpt-oss-20b
      provider: custom
      base_url: http://litellm:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
    auxiliary:
      title_generation:
        enabled: false
        provider: main
      compression:
        provider: main
    gateway:
      platforms:
        api_server:
          enabled: false
    # This profile is callable only by Daiki's dedicated, quota-checked image
    # generation endpoint. It exposes image_gen and nothing else.
    platform_toolsets:
      api_server:
        - image_gen
    terminal:
      backend: docker
      docker_network: false
      docker_mount_cwd_to_workspace: false
    agent:
      api_max_retries: 1
      disabled_toolsets:
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - video
        - video_gen
        - x_search
        - skills
        - todo
        - memory
        - context_engine
        - session_search
        - delegation
        - cronjob
        - computer_use
        - messaging
        - homeassistant
        - spotify
        - discord
        - discord_admin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: daiki-ai-passport
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: daiki-ai-passport
spec:
  replicas: 1
  selector:
    matchLabels: {app: hermes}
  template:
    metadata:
      labels: {app: hermes}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: patch-clarify-schema
          image: nousresearch/hermes-agent:v2026.9.7
          command:
            - sh
            - -ec
            - |
              python - <<'PY'
              from pathlib import Path
              src = Path('/opt/hermes/tools/clarify_tool.py').read_text()
              needle = '"maxItems": MAX_CHOICES,'
              if src.count(needle) != 1:
                  raise SystemExit('clarify schema patch target changed; refusing to start')
              # Provider-side tool validation happens before clarify_tool() can normalize.
              # Accept a bounded oversized model call here; _clean_choices() still caps UI choices to 4.
              src = src.replace(needle, '"maxItems": 16,', 1)
              nullable_needle = '"choices": {\n                            "type": "array",'
              if nullable_needle not in src:
                  raise SystemExit('clarify nullable choices patch target changed; refusing to start')
              src = src.replace(nullable_needle, '"choices": {\n                            "type": ["array", "null"],', 1)
              Path('/tool-overrides/clarify_tool.py').write_text(src)
              PY
              chmod 0444 /tool-overrides/clarify_tool.py
          volumeMounts:
            - {name: tool-overrides, mountPath: /tool-overrides}
        - name: bootstrap-config
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              install -d -m 0750 -o 10000 -g 10000 /data/profiles/user /data/profiles/skills /data/profiles/agent /data/profiles/research /data/profiles/guest /data/profiles/guest-media
              install -m 0600 -o 10000 -g 10000 /bootstrap/config.yaml /data/config.yaml
              install -m 0600 -o 10000 -g 10000 /bootstrap/user-config.yaml /data/profiles/user/config.yaml
              install -m 0600 -o 10000 -g 10000 /bootstrap/skills-config.yaml /data/profiles/skills/config.yaml
              install -m 0600 -o 10000 -g 10000 /bootstrap/agent-config.yaml /data/profiles/agent/config.yaml
              install -m 0600 -o 10000 -g 10000 /bootstrap/research-config.yaml /data/profiles/research/config.yaml
              install -m 0600 -o 10000 -g 10000 /bootstrap/guest-config.yaml /data/profiles/guest/config.yaml
              install -m 0600 -o 10000 -g 10000 /bootstrap/guest-media-config.yaml /data/profiles/guest-media/config.yaml
              umask 077
              printf 'LITELLM_MASTER_KEY=%s\nAPI_SERVER_KEY=%s\n' "$LITELLM_MASTER_KEY" "$API_SERVER_KEY" > /runtime-secrets/litellm.env
              chown 10000:10000 /runtime-secrets/litellm.env
              ln -sfn /runtime-secrets/litellm.env /data/.env
              ln -sfn /runtime-secrets/litellm.env /data/profiles/user/.env
              ln -sfn /runtime-secrets/litellm.env /data/profiles/skills/.env
              ln -sfn /runtime-secrets/litellm.env /data/profiles/agent/.env
              ln -sfn /runtime-secrets/litellm.env /data/profiles/research/.env
              ln -sfn /runtime-secrets/litellm.env /data/profiles/guest/.env
              ln -sfn /runtime-secrets/litellm.env /data/profiles/guest-media/.env
              touch /data/profiles/user/.no-bundled-skills /data/profiles/agent/.no-bundled-skills /data/profiles/research/.no-bundled-skills /data/profiles/guest/.no-bundled-skills /data/profiles/guest-media/.no-bundled-skills
              chown 10000:10000 /data/profiles/user/.no-bundled-skills /data/profiles/agent/.no-bundled-skills /data/profiles/research/.no-bundled-skills /data/profiles/guest/.no-bundled-skills /data/profiles/guest-media/.no-bundled-skills
          env:
            - {name: LITELLM_MASTER_KEY, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: litellm-master-key}}}
            - {name: API_SERVER_KEY, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: hermes-api-key}}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: runtime-secrets, mountPath: /runtime-secrets}
            - {name: config, mountPath: /bootstrap/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: config, mountPath: /bootstrap/user-config.yaml, subPath: user-config.yaml, readOnly: true}
            - {name: config, mountPath: /bootstrap/skills-config.yaml, subPath: skills-config.yaml, readOnly: true}
            - {name: config, mountPath: /bootstrap/agent-config.yaml, subPath: agent-config.yaml, readOnly: true}
            - {name: config, mountPath: /bootstrap/research-config.yaml, subPath: research-config.yaml, readOnly: true}
            - {name: config, mountPath: /bootstrap/guest-config.yaml, subPath: guest-config.yaml, readOnly: true}
            - {name: config, mountPath: /bootstrap/guest-media-config.yaml, subPath: guest-media-config.yaml, readOnly: true}
        - name: seed-skills-profile
          image: nousresearch/hermes-agent:v2026.9.7
          command:
            - sh
            - -ec
            - |
              HERMES_HOME=/data/profiles/skills /opt/hermes/.venv/bin/python -m hermes_cli.main skills opt-in --sync
              chown -R 10000:10000 /data/profiles/skills/skills /data/profiles/skills/.bundled_skills* 2>/dev/null || true
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.9.7
          args: ["gateway","run"]
          ports:
            - {name: http, containerPort: 8642}
          env:
            - {name: HERMES_UID, value: "10000"}
            - {name: HERMES_GID, value: "10000"}
            - {name: API_SERVER_ENABLED, value: "true"}
            - {name: API_SERVER_HOST, value: "0.0.0.0"}
            - {name: API_SERVER_PORT, value: "8642"}
            - {name: API_SERVER_MODEL_NAME, value: "daiki-hermes"}
            - {name: API_SERVER_KEY, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: hermes-api-key}}}
            - {name: LITELLM_MASTER_KEY, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: litellm-master-key}}}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /opt/data}
            - {name: runtime-secrets, mountPath: /runtime-secrets, readOnly: true}
            - {name: tool-overrides, mountPath: /opt/hermes/tools/clarify_tool.py, subPath: clarify_tool.py, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: hermes-data}
        - name: runtime-secrets
          emptyDir: {medium: Memory}
        - name: tool-overrides
          emptyDir: {}
        - name: config
          configMap: {name: hermes-config}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: daiki-ai-passport
spec:
  selector: {app: hermes}
  ports:
    - {name: http, port: 8642, targetPort: http}

apiVersion: apps/v1
kind: Deployment
metadata: {name: keycloak, namespace: daiki-ai-passport}
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          args: ["start","--http-enabled=true","--health-enabled=true"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://daiki-postgres:5432/keycloak"}
            - {name: KC_DB_USERNAME, value: daiki}
            - {name: KC_DB_PASSWORD, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: postgres-password}}}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: bootstrap-admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: keycloak-bootstrap-password}}}
            - {name: KC_HOSTNAME, value: "https://api.matchchemical.co"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_METRICS_ENABLED, value: "true"}
          startupProbe: {httpGet: {path: /health/started, port: management}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health/ready, port: management}, periodSeconds: 10, failureThreshold: 12}
          livenessProbe: {httpGet: {path: /health/live, port: management}, periodSeconds: 20, failureThreshold: 6}
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {cpu: "1", memory: 1400Mi}
---
apiVersion: v1
kind: Service
metadata: {name: keycloak, namespace: daiki-ai-passport}
spec:
  type: NodePort
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30401}
    - {name: management, port: 9000, targetPort: management}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: daiki-ai-passport
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["auth.ai.infra.local"]
      secretName: daiki-ai-passport-infra-local-tls
  rules:
    - host: auth.ai.infra.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: keycloak, port: {number: 8080}}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: keycloak-bootstrap-v10, namespace: daiki-ai-passport}
spec:
  backoffLimit: 12
  template:
    metadata: {labels: {app: keycloak-bootstrap}}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: quay.io/keycloak/keycloak:26.7.3
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: bootstrap-admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: keycloak-bootstrap-password}}}
            - {name: DAIKI_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: initial-admin-password}}}
            - {name: ADMIN_EMAIL, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: admin-email}}}
            - {name: GOOGLE_CLIENT_ID, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: google-client-id, optional: true}}}
            - {name: GOOGLE_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: google-client-secret, optional: true}}}
          command: ["/bin/bash","-ec"]
          args:
            - |
              K=/opt/keycloak/bin/kcadm.sh
              until $K config credentials --server http://keycloak:8080 --realm master --user "$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null 2>&1; do sleep 5; done
              if $K get realms/daiki >/dev/null 2>&1; then
                $K update realms/daiki -s enabled=true -s registrationAllowed=true -s registrationEmailAsUsername=true -s loginWithEmailAllowed=true -s duplicateEmailsAllowed=false -s resetPasswordAllowed=true -s rememberMe=true -s verifyEmail=false
              else
                $K create realms -s realm=daiki -s enabled=true -s registrationAllowed=true -s registrationEmailAsUsername=true -s loginWithEmailAllowed=true -s duplicateEmailsAllowed=false -s resetPasswordAllowed=true -s rememberMe=true -s verifyEmail=false
              fi
              $K get roles/ai-user -r daiki >/dev/null 2>&1 || $K create roles -r daiki -s name=ai-user -s description='Daiki AI user'
              $K get roles/ai-admin -r daiki >/dev/null 2>&1 || $K create roles -r daiki -s name=ai-admin -s description='Daiki AI administrator'
              CLIENT_ID="$($K get clients -r daiki -q clientId=daiki-web --fields id --format csv --noquotes | head -n1)"
              if [ -z "$CLIENT_ID" ]; then
                $K create clients -r daiki -s clientId=daiki-web -s enabled=true -s publicClient=true -s standardFlowEnabled=true -s directAccessGrantsEnabled=false -s 'redirectUris=["https://daiki-aipass.matchchemical.co/*","https://ai.infra.local/*"]' -s 'webOrigins=["https://daiki-aipass.matchchemical.co","https://ai.infra.local"]'
              else
                $K update clients/$CLIENT_ID -r daiki -s enabled=true -s publicClient=true -s standardFlowEnabled=true -s directAccessGrantsEnabled=false -s 'redirectUris=["https://daiki-aipass.matchchemical.co/*","https://ai.infra.local/*"]' -s 'webOrigins=["https://daiki-aipass.matchchemical.co","https://ai.infra.local"]'
              fi
              echo identity-provider-mapper-managed-outside-bootstrap
              if [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
                cat >/tmp/google-idp.json <<EOF
              {"alias":"google","displayName":"Google","providerId":"google","enabled":true,"trustEmail":true,"storeToken":false,"linkOnly":false,"firstBrokerLoginFlowAlias":"first broker login","config":{"clientId":"$GOOGLE_CLIENT_ID","clientSecret":"$GOOGLE_CLIENT_SECRET","defaultScope":"openid profile email","syncMode":"IMPORT"}}
              EOF
                if $K get identity-provider/instances/google -r daiki >/dev/null 2>&1; then
                  $K update identity-provider/instances/google -r daiki -f /tmp/google-idp.json
                else
                  $K create identity-provider/instances -r daiki -f /tmp/google-idp.json
                fi
                echo google-idp-configured
              else
                echo google-idp-not-configured
              fi
              if ! $K get users -r daiki -q username=admin --fields id --format csv --noquotes | grep -q .; then
                $K create users -r daiki -s username=admin -s enabled=true -s email=admin@daiki.local -s emailVerified=true
                $K set-password -r daiki --username admin --new-password "$DAIKI_ADMIN_PASSWORD"
                $K add-roles -r daiki --uusername admin --rolename ai-user --rolename ai-admin
              fi
              if [ -n "${ADMIN_EMAIL:-}" ]; then
                ADMIN_USER_ID="$($K get users -r daiki -q email="$ADMIN_EMAIL" --fields id --format csv --noquotes | head -n1)"
                if [ -n "$ADMIN_USER_ID" ]; then
                  if $K add-roles -r daiki --uid "$ADMIN_USER_ID" --rolename ai-user --rolename ai-admin; then
                    echo configured-admin-role-synced
                  else
                    echo configured-admin-role-sync-failed
                  fi
                else
                  echo configured-admin-user-not-created-yet
                fi
              fi
              echo bootstrap-complete

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-public
  namespace: daiki-ai-passport
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["api.matchchemical.co"]
      secretName: daiki-ai-passport-public-auth-tls
  rules:
    - host: api.matchchemical.co
      http:
        paths:
          - path: /realms/daiki
            pathType: Prefix
            backend: {service: {name: keycloak, port: {number: 8080}}}
          - path: /resources
            pathType: Prefix
            backend: {service: {name: keycloak, port: {number: 8080}}}

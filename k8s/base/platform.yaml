apiVersion: v1
kind: Namespace
metadata:
  name: daiki-ai-passport
  labels:
    app.kubernetes.io/part-of: daiki-ai-passport
---
apiVersion: v1
kind: ConfigMap
metadata: {name: litellm-config, namespace: daiki-ai-passport}
data:
  config.yaml: |
    model_list:
      - model_name: qwen-local
        litellm_params:
          model: openai/qwen3.8-27b
          api_base: os.environ/LOCAL_LLM_BASE_URL
          api_key: os.environ/LOCAL_LLM_API_KEY
          timeout: 300
    router_settings:
      routing_strategy: least-busy
      num_retries: 1
      timeout: 300
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
    litellm_settings:
      drop_params: true
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: litellm, namespace: daiki-ai-passport}
spec:
  replicas: 1
  selector: {matchLabels: {app: litellm}}
  template:
    metadata: {labels: {app: litellm}}
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config","/app/config.yaml","--port","4000","--num_workers","2"]
          ports: [{name: http, containerPort: 4000}]
          env:
            - {name: LOCAL_LLM_BASE_URL, valueFrom: {configMapKeyRef: {name: daiki-ai-passport-runtime, key: local-llm-base-url}}}
            - {name: LOCAL_LLM_API_KEY, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: local-llm-api-key}}}
            - {name: LITELLM_MASTER_KEY, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: litellm-master-key}}}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: database-url}}}
            - {name: REDIS_HOST, value: daiki-redis}
            - {name: REDIS_PORT, value: "6379"}
          readinessProbe: {httpGet: {path: /health/readiness, port: http}, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 12}
          livenessProbe: {httpGet: {path: /health/liveliness, port: http}, initialDelaySeconds: 35, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true}]
      volumes: [{name: config, configMap: {name: litellm-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: litellm, namespace: daiki-ai-passport}
spec:
  type: NodePort
  selector: {app: litellm}
  ports: [{name: http, port: 4000, targetPort: http, nodePort: 30400}]

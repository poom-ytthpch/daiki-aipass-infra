apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: daiki-ai-passport
data:
  settings.yml: |
    use_default_settings: true
    general:
      debug: false
      instance_name: "Daiki Research"
    search:
      safe_search: 1
      formats:
        - html
        - json
    server:
      limiter: false
      public_instance: false
      image_proxy: false
      secret_key: "overridden-by-SEARXNG_SECRET"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: daiki-ai-passport
spec:
  replicas: 1
  selector:
    matchLabels: {app: searxng}
  template:
    metadata:
      labels: {app: searxng}
    spec:
      containers:
        - name: searxng
          image: docker.io/searxng/searxng@sha256:f5b40cdd30e658df7cc41ac4a5e7e221c5fe6936bd4c1b704f851004efbc1faa
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SEARXNG_SECRET, valueFrom: {secretKeyRef: {name: daiki-ai-passport-secrets, key: searxng-secret}}}
            - {name: SEARXNG_SETTINGS_PATH, value: /etc/searxng/settings.yml}
            - {name: SEARXNG_BASE_URL, value: "http://searxng:8080/"}
            - {name: SEARXNG_LIMITER, value: "false"}
            - {name: SEARXNG_PUBLIC_INSTANCE, value: "false"}
          volumeMounts:
            - {name: config, mountPath: /etc/searxng/settings.yml, subPath: settings.yml, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "750m", memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: searxng-config}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: daiki-ai-passport
spec:
  type: ClusterIP
  selector: {app: searxng}
  ports:
    - {name: http, port: 8080, targetPort: http}

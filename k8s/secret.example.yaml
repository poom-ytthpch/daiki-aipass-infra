apiVersion: v1
kind: Secret
metadata:
  name: daiki-ai-passport-secrets
  namespace: daiki-ai-passport
type: Opaque
stringData:
  admin-email: CHANGE_ME_ADMIN_EMAIL
  postgres-password: CHANGE_ME
  keycloak-bootstrap-password: CHANGE_ME
  initial-admin-password: CHANGE_ME
  litellm-master-key: CHANGE_ME
  local-llm-api-key: CHANGE_ME
  google-client-id: CHANGE_ME_OPTIONAL
  google-client-secret: CHANGE_ME_OPTIONAL
  database-url: postgresql://daiki:CHANGE_ME@daiki-postgres.daiki-ai-passport.svc.cluster.local:5432/litellm
  backend-database-url: postgresql://daiki:CHANGE_ME@daiki-postgres.daiki-ai-passport.svc.cluster.local:5432/backend
